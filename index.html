@font-face{font-family:"Miratrix";src:url("fonts/Miratrix-Normal.otf") format("opentype");font-display:swap}
:root{--bg:#000;--fg:#fff;--dim:rgba(255,255,255,.55);--pad:clamp(16px,3.5vw,48px)}
*{box-sizing:border-box;margin:0;padding:0}

body{background:var(--bg);color:var(--fg);font-family:"Onest",system-ui,sans-serif;font-weight:400;line-height:1.35;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.mira{font-family:"Miratrix","Onest",sans-serif;font-weight:400;text-transform:uppercase}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:flex-start;padding:20px var(--pad) 0}
.brand b{display:block;font-size:clamp(20px,2.2vw,30px);font-weight:400;line-height:1}
.brand small{display:block;margin-top:6px;font-size:12px;text-transform:uppercase}
.top{display:flex;gap:clamp(16px,3vw,40px);font-size:clamp(14px,1.4vw,20px)}

.hero{display:grid;grid-template-columns:1fr minmax(0,38%);align-items:center;gap:var(--pad);padding:0 var(--pad);margin-top:clamp(8px,2vw,28px)}

.menu{display:flex;justify-content:space-between;padding:clamp(24px,4vw,56px) var(--pad) 0;font-size:13px}
section.works{padding:0 var(--pad)}
.sec{display:flex;align-items:center;gap:20px;margin:clamp(28px,3.5vw,48px) 0 16px}
.sec h2{font-size:clamp(20px,2vw,28px);font-weight:400;white-space:nowrap}
.sec i{flex:1;height:1px;background:rgba(255,255,255,.5)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,28px)}
.card{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.card .th{display:block;aspect-ratio:16/9;background:#d9d9d9;overflow:hidden}
.card video{width:100%;height:100%;object-fit:cover;display:block}
.card .t{display:block;margin-top:12px;font-size:clamp(15px,1.5vw,20px);text-transform:uppercase;font-weight:400;line-height:1.15}
.card .d{display:block;margin-top:4px;font-size:10px;color:var(--dim);line-height:1.3;max-width:40ch}
.card:hover .t{opacity:.7}

.about p{margin-top:16px;font-size:clamp(14px,1.2vw,17px);line-height:1.4;max-width:46ch}

.skills i{width:6px;height:6px;border-radius:50%;background:#fff;flex:none}
.contacts{padding:clamp(40px,6vw,90px) var(--pad) 60px}
.contacts h2{font-size:clamp(56px,10vw,150px);line-height:1.1;font-weight:400}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:20px clamp(28px,5vw,80px);margin-top:clamp(24px,4vw,56px);font-size:clamp(15px,1.5vw,20px)}
.links a{display:flex;align-items:center;gap:12px}

.links svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.5;flex:none}

.right{display:flex;align-items:center;gap:clamp(16px,3vw,40px)}
.lang{display:flex;border:1px solid #fff;font-family:"Miratrix","Onest",sans-serif;font-size:clamp(13px,1.2vw,16px);line-height:1}

.yt:hover{color:#fff}
/* окно просмотра: видео слева, текст справа */
.modal.on{overflow:auto;align-items:flex-start;justify-content:flex-start}
#stage{margin:auto;max-width:100%;padding:20px 0}
.wrap{display:flex;gap:clamp(20px,2.5vw,40px);align-items:flex-start;width:min(94vw,1500px)}
.vid{flex:1 1 0;min-width:0}
.vid video,.vid iframe{width:100%;aspect-ratio:16/9;display:block;background:#000;border:0;max-height:88vh}
.info{flex:0 0 clamp(280px,27vw,400px);max-height:88vh;overflow:auto;padding-right:6px}
.info h3{font-size:clamp(20px,2vw,28px);font-weight:400;line-height:1.1}

.wrap.vert{width:auto;max-width:94vw;align-items:center}
.wrap.vert .reels{flex:none;height:84vh;max-width:none;margin:0}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal.on{display:flex;animation:in .25s ease}
@keyframes in{from{opacity:0}to{opacity:1}}
.box{position:relative;width:min(92vw,1280px);max-height:88vh}
.box video,.box iframe{width:100%;aspect-ratio:16/9;display:block;background:#000;border:0;max-height:88vh}
.close{position:fixed;top:14px;right:18px;z-index:60;background:none;border:0;color:#fff;font-size:34px;line-height:1;cursor:pointer;padding:6px 10px}
.reels{position:relative;height:88vh;aspect-ratio:9/16;max-width:92vw;margin:auto}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:2px}
.track::-webkit-scrollbar{display:none}
.track video{flex:0 0 100%;width:100%;height:100%;object-fit:contain;background:#000;scroll-snap-align:center}
.nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.4);color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;z-index:2}
.nav.l{left:8px}.nav.r{right:8px}
.dots{position:absolute;bottom:-26px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.dots b{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots b.on{background:#fff}
@media (max-width:820px){
 .skills i{display:none}.skills{gap:10px 24px}
 .modal.on{padding:56px 14px 24px}#stage{width:100%;padding:0}
 .wrap,.wrap.vert{flex-direction:column;width:100%;max-width:100%;align-items:stretch}
 .vid{flex:none;width:100%}.info{flex:none;width:100%;max-height:none}
 .wrap.vert .reels{height:68vh;align-self:center}
 header{flex-wrap:wrap;gap:14px}.right{width:100%;justify-content:space-between}
 .hero{grid-template-columns:1fr}
 .hero video{order:-1}
 .grid{grid-template-columns:1fr}
 .menu{flex-wrap:wrap;gap:10px}
 .about{flex-direction:column;align-items:flex-start;padding:0 var(--pad)}
 .about img{width:100%}
 .skills{justify-content:flex-start}
 .nav.l{left:6px}.nav.r{right:6px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.modal.on{animation:none}}
</style>
</head>

"x": "Моя первая коммерческая работа, в которой я сделала всё: от сценария до монтажа.\nКофейня всегда была дополнением к пространству и не имела популярности в городе, поэтому мы с командой пространства позиционировали её как отдельный бизнес и место для атмосферных встреч, работы и спокойного отдыха: с вкусным кофе, библиотекой, коллекцией винила и проигрывателем. Получился динамичный сюжет о разнообразной аудитории кофейни.",
"xe": "My first commercial project that I've worked on independently, including the very first script and the final edit.\nPreviously the coffee shop had been simply an addition to the main venue and wasn’t well known in the city. Together with the venue’s team, I worked on rebranding it into a standalone business with a unique relaxing atmosphere, a library, and even its own vinyl collection, turning it from a dull place into a home to gatherings between friends and colleagues over a cup of coffee.\nThe result is a dynamic story about the shop’s vibrant audience."

{
"t": "Весеннее меню кофейни",

"x": "Цель ролика не столько показать напитки, сколько «продать настроение». Концепция меню строилась на народных приметах Коми, объединённых темой весны, и у меня сразу возник образ пожилого человека, который прожил целую жизнь и теперь внимательно наблюдает за природой.\nЭту идею я реализовала в формате небольшого фильма.",
"xe": "This time the goal was more about selling the mood rather than trying to simply highlight the product. The menu concept was based on Komi folk omens tied together by the theme of spring. That put an idea in my head: an image of an elderly man who’s lived a long and fulfilling life and now wants nothing more than to simply watch nature and observe the world around him.\nI decided to turn this idea into a short film."
}

"re": "Editing",
"x": "Арон Закрия был моим постоянным заказчиком: на его канале я монтировала расследование об Илоне Маске, ролики в формате «говорящая голова» и много подкастов. За пару месяцев публикаций новый канал без таргетированной рекламы набрал 8 000 подписчиков и хорошие просмотры.",
"xe": "Aron Zakria was a regular client of mine.\nWhile working for his channel, I was in charge of editing a documentary about Elon Musk, various types of “talking-head” videos, and a lot of podcasts. Just in a couple of months a brand-new channel reached over 8,000 subscribers and consistently high view counts."
},
{

"de": "Podcast | 2026",

"k": "yt",
"id": "q8KMC4KKMCw",
"start": 106,
"r": "Монтаж",
"re": "Editing",

"p": "p-moto",
"k": "yt",
"id": "Hljp_SsYzSw",
"r": "Монтаж",
"re": "Editing",
"x": "Задача: из 12 часов исходного материала и интервью собрать цельную эмоциональную историю. Мне было важно показать путь героя: его экспертность в электротранспорте, преодоление себя и весь спектр эмоций от участия в гонках, не забыв о юморе, а также наглядно визуализировать техническую информацию.",
"xe": "The task was to turn 12 hours of raw footage and interviews into one consistent and emotional story. The main focus was the protagonist’s journey: his expertise in electric transport, ability to push past his limits, and the full range of emotions of racing that he experienced. It was very important not to forget about the humorous tone of the story while also making the “technical” part of the video more “digestible”."
}

"d": "Reels | 2024",
"de": "Reels | 2024",

},
{
"t": "Что ты мне сегодня дашь, незнакомый человек?",

"x": "Тизер выставочного проекта и моя первая серьёзная работа в видеоконтенте. Выставка прошла в селе Аджером, на месте бывшего Локчимского исправительно-трудового лагеря системы ГУЛАГ, и была посвящена осмыслению сложного прошлого этого места и памяти о репрессиях. Тизер кратко визуализирует проект и передаёт эмоции, которые может испытывать человек в этом месте.\nЗакадровые голоса читают реальные письма заключённых, эти же записи использованы в одной из инсталляций.",

}
]
},
{
"h": "Артисты",
"he": "Artists",
"items": [
{

"d": "Клип | 2025",
"de": "Music video | 2025",
"p": "p-gps",
"k": "v",
"src": "v-gps",
"r": "Режиссура, съёмка, монтаж",
"re": "Directing, filming, editing",
"x": "Проект задумывался как небольшой визуал для соцсетей, но артисту так понравились исходники, что он решил сделать из них полноценный клип. Съёмка прошла быстро, без сценария и подготовки, поэтому основное внимание я уделила цветокоррекции, которой давно хотела учиться профессионально, и в этой работе вышла на новый уровень.\nСпонтанность дала мне свободу, а свобода возможность глубже раскрыться через картинку.",
"xe": "The project started as a small visual meant to be a promotional piece for social media only, but the artist behind it liked the final result so much that it was later turned into a full music video.\nThere was no script or any sort of preparations before we decided to shoot, and the process itself didn't take much time at all. That allowed me to primarily focus on color grading, which I had always wanted to try my hand in and learn to do professionally. The spontaneity of this project gave me freedom; meanwhile, the freedom allowed me to learn how to express myself throughout my work."

const root=document.getElementById("works"),REF=[];
SECTIONS.forEach(s=>{
  const sec=document.createElement("div");
  sec.innerHTML=`<div class="sec"><h2 class="mira"></h2><i></i></div><div class="grid"></div>`;
  REF.push({el:sec.querySelector("h2"),ru:s.h,en:s.he});
  const g=sec.querySelector(".grid");
  s.items.forEach(it=>{
    const b=document.createElement("button");b.className="card";b.type="button";
    b.innerHTML=`<span class="th"><video src="media/${it.p}.mp4" poster="media/${it.p}.jpg" muted loop playsinline preload="metadata"></video></span><span class="t"></span><span class="d"></span>`;
    REF.push({el:b.querySelector(".t"),ru:it.t,en:it.te},{el:b.querySelector(".d"),ru:it.d,en:it.de});
    b.addEventListener("click",()=>openItem(it));
    g.appendChild(b);
  });
  root.appendChild(sec);
});

// превью: на компьютере при наведении, на телефоне — когда карточка в зоне видимости
const vids=[...document.querySelectorAll(".card video")];
const play=v=>{const p=v.play();if(p&&p.catch)p.catch(()=>{})};
const stop=v=>{v.pause();try{v.load()}catch(e){}};
if(matchMedia("(hover:hover)").matches){
  document.querySelectorAll(".card").forEach(c=>{
    const v=c.querySelector("video");
    c.addEventListener("mouseenter",()=>play(v));c.addEventListener("mouseleave",()=>stop(v));
    c.addEventListener("focus",()=>play(v));c.addEventListener("blur",()=>stop(v));
  });
}else{
  const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?play(e.target):stop(e.target)),{threshold:.6});
  vids.forEach(v=>io.observe(v));
}

// окно просмотра
const modal=document.getElementById("modal"),stage=document.getElementById("stage");
function infoHTML(it){
  const en=LANG==="en",roles=en?it.re:it.r,text=(en?it.xe:it.x)||"";
  return `<aside class="info"><h3 class="mira">${en?it.te:it.t}</h3>${roles?`<div class="roles">${roles}</div>`:""}${text.split("\n").map(p=>`<p>${p}</p>`).join("")}</aside>`;
}
function openItem(it){
  let left;
  if(it.k==="yt"){
    left=`<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${it.id}?autoplay=1&rel=0${it.start?"&start="+it.start:""}" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${it.t}"></iframe><a class="yt" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${it.id}${it.start?"&t="+it.start+"s":""}">${T[LANG].yt}</a></div>`;
  }else if(it.k==="reels"){
    left=`<div class="reels"><div class="track">${it.src.map(s=>`<video src="media/${s}.mp4" playsinline controls preload="metadata"></video>`).join("")}</div><button class="nav l" aria-label="Назад">&#8249;</button><button class="nav r" aria-label="Вперёд">&#8250;</button><div class="dots">${it.src.map(()=>"<b></b>").join("")}</div></div>`;
  }else{
    left=`<div class="vid"><video src="media/${it.src}.mp4" controls autoplay playsinline></video></div>`;
  }
  stage.innerHTML=`<div class="wrap${it.k==="reels"?" vert":""}">${left}${infoHTML(it)}</div>`;
  if(it.k==="reels"){
    const tr=stage.querySelector(".track"),vs=[...tr.children],ds=[...stage.querySelectorAll(".dots b")];
    let cur=-1;
    const sync=()=>{const i=Math.round(tr.scrollLeft/tr.clientWidth);if(i===cur)return;cur=i;vs.forEach((v,j)=>{if(j===i)play(v);else{v.pause();v.currentTime=0}});ds.forEach((d,j)=>d.classList.toggle("on",j===i))};
    tr.addEventListener("scroll",()=>{clearTimeout(tr._t);tr._t=setTimeout(sync,80)});
    stage.querySelector(".l").onclick=()=>tr.scrollBy({left:-tr.clientWidth,behavior:"smooth"});
    stage.querySelector(".r").onclick=()=>tr.scrollBy({left:tr.clientWidth,behavior:"smooth"});
    sync();
  }
  modal.scrollTop=0;modal.classList.add("on");document.body.style.overflow="hidden";
}
function closeModal(){modal.classList.remove("on");stage.innerHTML="";document.body.style.overflow=""}
document.getElementById("close").onclick=closeModal;
modal.addEventListener("click",e=>{if(e.target===modal||e.target===stage)closeModal()});
addEventListener("keydown",e=>{
  if(!modal.classList.contains("on"))return;
  if(e.key==="Escape")closeModal();
  const tr=stage.querySelector(".track");
  if(tr&&e.key==="ArrowRight")tr.scrollBy({left:tr.clientWidth,behavior:"smooth"});
  if(tr&&e.key==="ArrowLeft")tr.scrollBy({left:-tr.clientWidth,behavior:"smooth"});
});

function setLang(l){

}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
